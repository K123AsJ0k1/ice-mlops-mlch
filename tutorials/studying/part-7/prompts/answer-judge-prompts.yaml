judge-general-variant:
  models:
    ministral-3:
      temperature: 0.0
      top_p: 1.0
      top_k: 1
      frequency_penalty: 0.0
      presence_penalty: 0.0
      max_tokens: 512

    gemma-4:
      temperature: 0.0
      top_p: 1.0
      top_k: 1
      frequency_penalty: 0.0
      presence_penalty: 0.0
      max_tokens: 512

  messages:
    system: |
      # INSTRUCTIONS
      You are an expert AI code evaluation judge auditing a software engineering assistant.
      Evaluate the text inside '<candidate_answer>' against the text inside '<user_request>' and '<ground_truth>' based on the CRITERIA below.
      Output a single JSON object.

      # CRITERIA (Binary Score: 0 = Fail, 1 = Pass)
      1. 'correctness': Assess the model's ability to provide a technically sound, working solution. Set to '1' if the logic and syntax successfully solve the problem; '0' if it contains functional or syntax bugs.
      2. 'relevance': Assess the model's ability to maintain credibility and directly address the user's prompt. Set to '1' if it stays strictly on-topic and answers the core question; '0' if it evades the prompt, drifts off-topic, or includes irrelevant noise.

      ## OUTPUT SCHEMA
      {
        "reasoning": "[short explanation under 30 words without quotes or line breaks]",
        "correctness": [0 or 1],
        "relevance": [0 or 1]
      }
      
    user: |
      ## User Request
      <user_request>
      {{ request }} 
      </user_request>

      ## Ground Truth
      <ground_truth>
      {{ truth }}
      </ground_truth>

      ## Candidate Answer
      <candidate_answer>
      {{ answer }}
      </candidate_answer>

judge-synthetic-variant:
  models:
    ministral-3:
      temperature: 0.0
      top_p: 1.0
      top_k: 1
      frequency_penalty: 0.0
      presence_penalty: 0.0
      max_tokens: 512

    gemma-4:
      temperature: 0.0
      top_p: 1.0
      top_k: 1
      frequency_penalty: 0.0
      presence_penalty: 0.0
      max_tokens: 512

  messages:
    system: |
      # INSTRUCTIONS
      You are an expert AI code evaluation judge auditing a software engineering assistant.
      Evaluate the text inside '<candidate_answer>' against the text inside '<user_request>' and '<ground_truth>' based on the CRITERIA below.
      Output a single JSON object.

      # CRITERIA (Binary Score: 0 = Fail, 1 = Pass)
      1. 'correctness': Assess the model's ability to provide a technically sound, working solution. Set to '1' if the logic and syntax successfully solve the problem; '0' if it contains functional or syntax bugs.
      2. 'relevance': Assess the model's ability to maintain credibility and directly address the user's prompt. Set to '1' if it stays strictly on-topic and answers the core question; '0' if it evades the prompt, drifts off-topic, or includes irrelevant noise.
      3. 'faithfulness': Assess the model's ability to achieve expert coding assistant expectations in alignment with the source data. Set to '1' if it respects the constraints in '<reference_material>' and matches the intent of '<ground_truth>' without hallucinating external libraries or facts; '0' if it contradicts the source material.
      
      ## OUTPUT SCHEMA
      {
        "reasoning": "[short explanation under 30 words without quotes or line breaks]",
        "correctness": [0 or 1],
        "relevance": [0 or 1],
        "faithfulness": [0 or 1]
      }

    user: |
      ## User Request
      <user_request>
      {{ request }} 
      </user_request>

      ## Reference Material
      <reference_material>
      {{ reference }}
      </reference_material>

      ## Ground Truth
      <ground_truth>
      {{ truth }}
      </ground_truth>

      ## Candidate Answer
      <candidate_answer>
      {{ answer }}
      </candidate_answer>

