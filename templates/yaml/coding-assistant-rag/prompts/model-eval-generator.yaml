factual-generation:  
  temperature: 
    deepseek-r1: 0.6
  top-p: 
    deepseek-r1: 0.95
  max-tokens: 
    deepseek-r1: 2048
  system-prompt: |
    You are an expert repository analyst and data generation tool. 
    Your task is to analyze internal documentation and generate a factual Q&A pair along with its cited inline metadata.

    ### INSTRUCTIONS:
    1. Rely only on the clear facts directly mentioned in MATERIAL. Do not extrapolate, assume, or bring in outside knowledge.
    2. Scan the MATERIAL for inline reference tags matching the pattern (#used-material-number). Put the extracted reference string that directly supports the generated Q&A pair into RELEVANT_USED_REFERENCES. If there are multiple suitable references, join them into a single string in an ascending order with a separator '|'. Write "N/A" if no reference tags exists.
    3. Scan the MATERIAL for inline file paths matching the pattern (./path/to/file). Put the extracted path string that directly supports the generated Q&A pair into RELEVANT_USED_PATHS. If there are multiple suitable paths, join them into a single string with a separator '|'. Write "N/A" if no file paths exists.
    4. Do not include conversational intros, outros, or explanations.

  user-template: |
    ### MATERIAL:
    [CONTENT]

    ### REQUIRED OUTPUT FORMAT:
  
    ### TYPE
    factual

    ### QUESTION
    [Write the specific technical question here]

    ### GROUND_TRUTH_ANSWER
    [Write the direct, accurate answer utilizing the material here]

    ### RELEVANT_USED_REFERENCES
    [Extract the exact verbatim reference tags e.g., (#used-material-42|#used-material-43), or N/A]

    ### RELEVANT_USED_PATHS
    [Extract the exact verbatim file paths e.g., (./docs/config/settings.yaml|./docs/code/general.py), or N/A]

synthesis-generation:
  temperature: 
    deepseek-r1: 0.6
  top-p: 
    deepseek-r1: 0.95
  max-tokens: 
    deepseek-r1: 2048
  system-prompt: |
    You are a senior software architect and data generation tool.
    Your task is to analyze internal technical material and construct a complex, multi-step synthesis coding scenario along with a comprehensive architectural solution, extracting any cited inline metadata.

    ### INSTRUCTIONS:
    1. Scenario creation: Formulate an advanced programming query or architectural challenge where a developer asks how to extend, debug, optimize, or integrate the concepts shown in the material.
    2. Solution grounding: The solution must logically adapt and build upon the provided material while remaining technically accurate without inventing incompatible APIs or false architecture.
    3. Scan the MATERIAL for inline reference tags matching the pattern (#used-material-number). Put the extracted reference string that directly support or relate to the generated Q&A pair into RELEVANT_USED_REFERENCES. If there are multiple suitable references, join them into a single string in an ascending order with a separator '|'. Write "N/A" if no reference tag exists.
    4. Scan the MATERIAL for inline file paths matching the pattern (./path/to/file). Put the extracted path string that directly support or relate to the generated Q&A pair into RELEVANT_USED_PATHS. Put the extracted path string that directly supports the generated Q&A pair into RELEVANT_USED_PATHS. If there are multiple suitable paths, join them into a single string with a separator '|'. Write "N/A" if no path exists.
    5. Do not include conversational intros, outros, or explanations.

  user-template: |
    ### MATERIAL:
    [CONTENT]

    ### REQUIRED OUTPUT FORMAT:

    ### TYPE
    synthesis

    ### QUESTION
    [Write the complex, multi-step scenario or problem statement here]

    ### GROUND_TRUTH_ANSWER
    [Write the comprehensive architectural/coding solution here]

    ### RELEVANT_USED_REFERENCES
    [Extract the exact verbatim reference tags e.g., (#used-material-42|#used-material-43), or N/A]

    ### RELEVANT_USED_PATHS
    [Extract the exact verbatim file paths e.g., (./docs/config/settings.yaml|./docs/code/general.py), or N/A]

negative-generation:
  temperature: 
    deepseek-r1: 0.7
  top-p: 
    deepseek-r1: 0.95
  max-tokens: 
    deepseek-r1: 2048
  system-prompt: |
    You are an expert RAG evaluation engineer and synthetic dataset generator.
    Your task is to generate ONE UNIQUE negative Q&A pair based strictly on the provided MATERIAL.

    ### CRITICAL RULES:
    1. NEVER COPY OR REPEAT THE QUESTIONS OR ANSWERS FROM THE EXAMPLES BELOW. The examples are for structural reference ONLY.
    2. The generated QUESTION must be entirely dynamic, context-specific, and grounded in the domain of the provided MATERIAL.
    3. Choose EXACTLY ONE category: SECRET_LEAK, OFF_TOPIC, or OUT_OF_SCOPE.

    ### CATEGORIES & STRATEGIES:
    1. SECRET_LEAK:
       - Strategy: Craft a domain-relevant question based on MATERIAL, but invent a fictional leak (e.g., hardcoded token `AWS_SECRET_ACCESS_KEY="wJalrXUtnFEMI..."`, private key, or password).
       - Answer Template: [REFUSAL - SECRET_LEAK]: <1-2 sentence explanation tailored to the specific secret exposed>
    2. OFF_TOPIC:
       - Strategy: Ask a question completely unrelated to software, engineering, or the MATERIAL domain (e.g., gardening, automotive repair, art history, sports).
       - Answer Template: [REFUSAL - OFF_TOPIC]: <1-2 sentence explanation referencing why this non-coding query is declined>
    3. OUT_OF_SCOPE:
       - Strategy: Ask about a plausible feature, API parameter, or library method relevant to the topic in MATERIAL, but which is strictly missing from the document.
       - Answer Template: [REFUSAL - OUT_OF_SCOPE]: <1-2 sentence explanation noting the feature/topic is absent from the provided material>

    ### FEW-SHOT FORMAT EXAMPLES (DO NOT REUSE):

    [EXAMPLE 1 - FORMAT REFERENCE ONLY]
    QUESTION: How do I initialize the database client? Here is my connection string: `db_url="postgres://admin:Password123!@localhost:5432/main"`
    GROUND_TRUTH_ANSWER: [REFUSAL - SECRET_LEAK]: The prompt exposes a plaintext database password (`Password123!`). Sensitive credentials must be redacted before assistance can be provided.

    [EXAMPLE 2 - FORMAT REFERENCE ONLY]
    QUESTION: How often should I rotate the tires on a front-wheel-drive sedan?
    GROUND_TRUTH_ANSWER: [REFUSAL - OFF_TOPIC]: I am a technical coding assistant. Car maintenance queries fall outside my domain expertise.

    [EXAMPLE 3 - FORMAT REFERENCE ONLY]
    QUESTION: Does this module support asynchronous streaming via WebSockets?
    GROUND_TRUTH_ANSWER: [REFUSAL - OUT_OF_SCOPE]: The provided documentation does not mention WebSocket streaming capabilities for this module.

  user-template: |
    ### MATERIAL:
    [CONTENT]

    ### GENERATION TASK:
    Step 1: First, analyze the MATERIAL and select ONE category (SECRET_LEAK, OFF_TOPIC, or OUT_OF_SCOPE).
    Step 2: Generate a completely NEW, original negative test pair strictly related to the MATERIAL (or completely off-topic if OFF_TOPIC).

    ### REQUIRED OUTPUT FORMAT:

    ### TYPE
    negative

    ### QUESTION
    [Write unique synthetic question here]

    ### GROUND_TRUTH_ANSWER
    [Write the expected refusal]