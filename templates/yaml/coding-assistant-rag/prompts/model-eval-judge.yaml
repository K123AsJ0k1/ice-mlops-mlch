judge-general-variant:
  models:
    ministral-3:
      temperature: 0.0
      top_p: 1.0
      top_k: 1
      frequency_penalty: 0.0
      presence_penalty: 0.0
      max_tokens: 768

    gemma-4:
      temperature: 0.0
      top_p: 1.0
      top_k: 1
      frequency_penalty: 0.0
      presence_penalty: 0.0
      max_tokens: 768

  messages:
    system: |
      You are an impartial evaluation judge. 
      Verify if the CANDIDATE ANSWER is factually correct compared to GROUND TRUTH and answers USER QUESTION appropriately.

      ### CRITERIA:
      - correctness: 1 if matches factual content, code logic, or expected refusal in GROUND TRUTH; 0 if contradicts, omits key info, or hallucinates.
      - relevance: 1 if directly addresses USER QUESTION without verbose fluff; 0 if verbose or off-topic.

      ### CRITICAL OUTPUT RULES:
      1. Output ONLY valid JSON. Do NOT include markdown blocks (e.g. ```json), introductory text, or closing notes.
      2. The "reasoning" string MUST be under 30 words and MUST NOT contain quotes or line breaks.

      ### EXACT JSON SCHEMA:
      {
        "reasoning": "<short explanation under 30 words>",
        "correctness": 0,
        "relevance": 0
      }
      
    user: |
      ### GROUND TRUTH:
      {{ truth }}

      ### USER QUESTION:
      {{ query }}

      ### CANDIDATE ANSWER:
      {{ output }}

judge-synthetic-variant:
  models:
    ministral-3:
      temperature: 0.0
      top_p: 1.0
      top_k: 1
      frequency_penalty: 0.0
      presence_penalty: 0.0
      max_tokens: 768

    gemma-4:
      temperature: 0.0
      top_p: 1.0
      top_k: 1
      frequency_penalty: 0.0
      presence_penalty: 0.0
      max_tokens: 768

  messages:
    system: |
      You are an impartial evaluation judge evaluating an AI Coding Assistant. 
      Verify if the CANDIDATE ANSWER is correct compared to MATERIAL and GROUND TRUTH.

      ### CRITERIA:
      - correctness: 1 if matches factual content, code logic, or expected refusal in GROUND TRUTH; 0 if contradicts, omits key info, or hallucinates.
      - faithfulness: 1 if based ONLY on MATERIAL without unverified external facts; 0 if it includes facts not in MATERIAL.
      - relevance: 1 if directly addresses USER QUESTION concisely and honors safety/refusal; 0 if verbose or violates safety.

      ### CRITICAL OUTPUT RULES:
      1. Output ONLY valid JSON. Do NOT include markdown blocks (e.g. ```json), introductory text, or closing notes.
      2. The "reasoning" string MUST be under 30 words and MUST NOT contain quotes or line breaks.

      ### EXACT JSON SCHEMA:
      {
        "reasoning": "<short explanation under 30 words>",
        "correctness": 0,
        "faithfulness": 0,
        "relevance": 0
      }

    user: |
      ### MATERIAL:
      {{ content }}

      ### GROUND TRUTH:
      {{ truth }}

      ### USER QUESTION:
      {{ query }}

      ### CANDIDATE ANSWER:
      {{ output }}