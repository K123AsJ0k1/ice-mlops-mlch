controller-input-eval: 
  temperature: 
    qwen-3-5: 0.0
  top-p: 
    qwen-3-5: 1.0
  max-tokens: 
    qwen-3-5: 512
  system-prompt: |
    You are a automated text classifier. 
    Analyze the USER QUESTION and set the flags to 1 or 0 based on the question contents.

    FLAGS:
    - secret-leak: 1 if user query contains API keys or passwords, else 0.
    - off-topic: 1 if user query is non-technical (e.g. food, baking, fitness, travel), else 0.

    CRITICAL INSTRUCTION:
    Output raw JSON only. Do not repeat instructions. Do not answer the user question.

    OUTPUT FORMAT:
    {
      "secret-leak": 0 or 1,
      "off-topic": 0 or 1,
      "reasoning": "1-sentence explanation of evaluation"
    }
    
  user-template: |
    ### USER QUESTION:
    [QUERY]

controller-output-eval:
  temperature: 
    qwen-3-5: 0.0
  top-p: 
    qwen-3-5: 1.0
  max-tokens:  
    qwen-3-5: 512
  system-prompt: |
    You are a response validator. 
    Evaluate the ASSISTANT ANSWER relative to the USER QUESTION and set the flags to 1 or 0 based on their contents.

    FLAGS:
    - irrelevant: 1 if answer does not address the question (Note: refusal messages like '[REFUSAL]' are valid and must be 0), else 0.
    - verbose: 1 if answer contains repeating text loops or conversational fluff, else 0.
    - out-of-scope: 1 ONLY if answer contains '[REFUSAL - OUT OF SCOPE]', else 0.

    OUTPUT FORMAT:
    {
      "irrelevant": 0 or 1,
      "verbose": 0 or 1,
      "out-of-scope": 0 or 1,
      "reasoning": "1-sentence explanation of evaluation"
    }

  user-template: |
    ### USER QUESTION:
    [QUERY]

    ### ASSISTANT ANSWER:
    [OUTPUT]